<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="stage.css">
<style>
  html, body { background: transparent; }
  .banner { position: relative; width: 1280px; height: 560px; border-radius: 28px; overflow: hidden; background: var(--bg); }
  .dark { --bg: #1c1d21; --title: #f3f2ef; --text: #8e8f94; --line: rgba(255, 255, 255, .1); --key: rgba(255, 255, 255, .06); --keyline: rgba(255, 255, 255, .16); --keyink: #f3f2ef; --frame: rgba(255, 255, 255, .1); }
  .light { --bg: #f3f2ef; --title: #16171a; --text: #6b6c70; --line: rgba(0, 0, 0, .08); --key: #fff; --keyline: rgba(22, 23, 26, .14); --keyink: #16171a; --frame: rgba(0, 0, 0, .08); }
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .copy .logo { margin-left: -6px; margin-bottom: 30px; }
  .copy h1 { font: 400 66px/1 'Sitka Heading', 'Sitka', Georgia, serif; color: var(--title); letter-spacing: -.6px; }
  .copy h1 i { font-style: italic; }
  .copy p { margin-top: 22px; font: 20px/1.5 var(--ui); color: var(--text); max-width: 500px; }
  .keys { margin-top: 30px; display: flex; align-items: center; gap: 8px; font: 14px var(--ui); color: var(--text); }
  .keys .k { height: 32px; min-width: 34px; padding: 0 11px; border-radius: 8px; display: grid; place-items: center; font: 600 13.5px var(--ui-display); color: var(--keyink);
    background: var(--key); box-shadow: inset 0 0 0 1px var(--keyline), inset 0 -2px 0 var(--line); }
  .keys .or { margin: 0 8px; }
  .keys .plus { opacity: .6; }
  .vignette { position: absolute; left: 676px; top: 62px; width: 540px; height: 436px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--frame), 0 24px 60px rgba(0, 0, 0, .28); }
  #root { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="copy">
    <div class="logo"></div>
    <h1>Screenshot <i>Toolkit</i></h1>
    <p>Press PrintScreen and keep working. The screenshot is saved, copied, and waiting in the corner.</p>
    <div class="keys"><span class="k">PrtSc</span><span class="or">or</span><span class="k kwin"></span><span class="plus">+</span><span class="k">Shift</span><span class="plus">+</span><span class="k">S</span></div>
  </div>
  <div class="vignette"><div id="root"></div></div>
</div>
<script src="brand.js"></script>
<script src="photos.js"></script>
<script src="desktop.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const banner = document.getElementById('banner');
  banner.classList.add(q.get('theme') || 'dark');
  banner.querySelector('.logo').innerHTML = logoSvg(84);
  banner.querySelector('.kwin').innerHTML = winKeySvg(getComputedStyle(banner).getPropertyValue('--keyink').trim());
  document.getElementById('root').style.transform = 'scale(1.15) translate(0px, -378px)';
</script>
</body>
</html>
